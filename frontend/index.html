<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Counsellor - Future of Education</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --accent: #FF8A00;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-blur: blur(20px);
            --text-main: #1E293B;
            --text-secondary: #64748B
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBm52cASBHaN77mf2nfqaAIp0iM3tRzgAxgpsZTQEHwxJ8J1ncHuNiSR-w_HjiCpj_31bD0r5ib7tqh5OE5X2iX5lbcPVsAtuCu6mma6MBx43fNe-41X51Sfw5N3drmqbXkV7m29L7C8djdDOcF0yiuO18WR9RjQFfnhqwB2S3n9qz7Eg036_V70pgPOXzJLXGVQ9bvTGMI5zEYakPgu0iIsQPIeYZt0G9fRjea3bVC_R3qyi1ybFA4TWlX3lllmfDwd2PnjnU4gl8);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #0f172a;
        }

        .bg-overlay {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px)
        }

        .bebas {
            font-family: 'Bebas Neue', cursive;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .glass-dark {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        .hero-bg-text {
            color: #0f172a;
            font-size: 28vw;
            line-height: 0.8;
            letter-spacing: -0.05em;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            filter: blur(0.5px);
        }

        @media (min-width: 768px) {
            .hero-bg-text {
                font-size: 25vw;
                opacity: 0.35;
            }
        }

        .orange-glow {
            box-shadow: 0 0 80px rgba(249, 115, 22, 0.2);
        }

        /* High-End Neural Engine Animations */
        .neural-orbit {
            animation: orbit 25s linear infinite;
        }

        .neural-orbit-reverse {
            animation: orbit-reverse 35s linear infinite;
        }

        .pulse-breathing {
            animation: breathing 4s ease-in-out infinite;
        }

        .scanner-sweep {
            animation: sweep 4s linear infinite;
        }

        .float-subtle {
            animation: float-subtle 8s ease-in-out infinite;
        }

        .data-glitch {
            animation: glitch 2s linear infinite;
        }

        @keyframes orbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes orbit-reverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes breathing {

            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.2));
            }

            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.5));
            }
        }

        @keyframes sweep {
            0% {
                transform: rotate(-45deg) translateY(-100%);
                opacity: 0;
            }

            30% {
                opacity: 0.4;
            }

            70% {
                opacity: 0.4;
            }

            100% {
                transform: rotate(-45deg) translateY(100%);
                opacity: 0;
            }
        }

        @keyframes float-subtle {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(1deg);
            }
        }

        @keyframes glitch {

            0%,
            100% {
                opacity: 1;
                transform: translateX(0);
            }

            92% {
                opacity: 1;
                transform: translateX(0);
            }

            93% {
                opacity: 0.5;
                transform: translateX(2px);
            }

            94% {
                opacity: 1;
                transform: translateX(-1px);
            }

            95% {
                opacity: 0.8;
                transform: translateX(0);
            }
        }

        .mist-overlay {
            background: linear-gradient(to bottom, transparent 0%, white 95%);
        }

        .capsule-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        /* Custom scrollbar for a pro feel */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        /* Markdown Prose Styles for Chat */
        .prose h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .prose h2 {
            font-size: 1.125rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0.875rem;
            margin-bottom: 0.375rem;
        }

        .prose h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .prose p {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .prose ul,
        .prose ol {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
        }

        .prose ul {
            list-style-type: disc;
        }

        .prose ol {
            list-style-type: decimal;
        }

        .prose li {
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }

        .prose strong {
            font-weight: 700;
            color: #f97316;
        }

        .prose code {
            background-color: #f1f5f9;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }

        .prose blockquote {
            border-left: 3px solid #f97316;
            padding-left: 1rem;
            font-style: italic;
            color: #64748b;
            margin: 0.75rem 0;
        }

        .prose hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 1rem 0;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07)
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.3)
        }

        .btn-gradient {
            background: linear-gradient(135deg, #FF8A00 0%, #FFB054 100%);
            box-shadow: 0 4px 15px rgba(255, 138, 0, 0.3)
        }

        .btn-light-refined {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease
        }

        .btn-light-refined:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translatey(-1px)
        }

        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "recharts": "https://esm.sh/recharts@^3.7.0"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div class="fixed inset-0 bg-overlay -z-10"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
